[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binarysentry"
version = "1.0.0"
description = "Static triage for PE, ELF and Mach-O binaries: verifies the real container format, measures per-section entropy, and explains every risk indicator."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Konain Sultan Khan (KK)", email = "kkdev9715@gmail.com"}]
keywords = ["security", "malware-analysis", "pe", "elf", "macho", "reverse-engineering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/kkcyber2/binarysentry"
Repository = "https://github.com/kkcyber2/binarysentry"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
binarysentry = "binarysentry.cli:main"

[tool.setuptools]
packages = ["binarysentry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
